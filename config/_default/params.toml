colorScheme = "blowfish"          # Sidens farvetema

mainSections = ["projects"]       # Sektioner, der bruges til at vise de seneste indlæg

[homepage]                        # Indstillinger for forsiden
layout = "profile"                # Vis forsiden med en forfatterprofil
showRecent = true                 # Vis de seneste indlæg på forsiden
showRecentItems = 3               # Vis højst 3 seneste indlæg
showMoreLink = true               # Vis et link til flere indlæg
showMoreLinkDest = "projects/"    # Link til siden med projekter
cardView = true                   # Vis indlæggene som kort

[list]                            # Indstillinger for listesider
cardView = true                   # Vis indholdet som kort
cardViewScreenWidth = false       # Begræns kortvisningen til sidens normale indholdsbredde

[article]                         # Indstillinger for artikelsider
showAuthor = false                # Skjul forfatteroplysninger
showPagination = false            # Skjul navigation til forrige og næste artikel